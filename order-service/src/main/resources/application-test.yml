spring:
  main:
    banner-mode: off
  kafka:
    listener:
      auto-startup: true

pazarsync:
  security:
    seed-users: true
    users:
      - username: admin
        password: admin
        role: ADMIN
      - username: operator
        password: operator
        role: OPERATOR
      - username: viewer
        password: viewer
        role: VIEWER
