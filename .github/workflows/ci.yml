name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify
        run: chmod +x mvnw && ./mvnw -B verify

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, dashboard]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build images
        run: |
          docker build -f mock-marketplace/Dockerfile -t pazarsync/mock-marketplace:ci .
          docker build -f order-importer/Dockerfile -t pazarsync/order-importer:ci .
          docker build -f order-service/Dockerfile -t pazarsync/order-service:ci .
          docker build -f dashboard/Dockerfile -t pazarsync/dashboard:ci .
      - name: Push images to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          prefix="ghcr.io/${owner}/pazarsync"
          docker tag pazarsync/mock-marketplace:ci "${prefix}-mock-marketplace:latest"
          docker tag pazarsync/order-importer:ci "${prefix}-order-importer:latest"
          docker tag pazarsync/order-service:ci "${prefix}-order-service:latest"
          docker tag pazarsync/dashboard:ci "${prefix}-dashboard:latest"
          docker push "${prefix}-mock-marketplace:latest"
          docker push "${prefix}-order-importer:latest"
          docker push "${prefix}-order-service:latest"
          docker push "${prefix}-dashboard:latest"
