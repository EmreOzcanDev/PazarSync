server:
  port: 8081

spring:
  application:
    name: order-service
  profiles:
    default: ai-stub
  datasource:
    url: jdbc:postgresql://localhost:5432/pazarsync
    username: pazarsync
    password: ${POSTGRES_PASSWORD:pazarsync}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

pazarsync:
  security:
    jwt-secret: ${JWT_SECRET:pazarsync-dev-jwt-secret-32bytes}
    seed-users: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
