server:
  port: 8083

spring:
  application:
    name: order-importer
  datasource:
    url: jdbc:postgresql://localhost:5432/importer
    username: pazarsync
    password: ${POSTGRES_PASSWORD:pazarsync}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.default_schema: importer
  flyway:
    schemas: importer
    default-schema: importer
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: order-importer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    listener:
      ack-mode: record

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

pazarsync:
  importer:
    marketplace-base-url: http://localhost:8082
    supplier-id: 1001
    marketplace: trendyol
    poll-delay-ms: 5000
    retry:
      max-attempts: 4
      initial-backoff-ms: 200
