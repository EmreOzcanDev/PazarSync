server:
  port: 8082

spring:
  application:
    name: mock-marketplace

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: livenessState

pazarsync:
  mock:
    supplier-id: 1001
    faults:
      enabled: true
      failure-rate: 0.1
      duplicate-rate: 0.15
    generator:
      enabled: true
      delay-ms: 4000
