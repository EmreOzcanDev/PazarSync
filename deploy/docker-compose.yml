services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: pazarsync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pazarsync}
      POSTGRES_DB: pazarsync
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pazarsync -d pazarsync"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:3.8.1
    hostname: kafka
    ports:
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 20s

  mock-marketplace:
    build:
      context: ..
      dockerfile: mock-marketplace/Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60"
    ports:
      - "8082:8082"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8082'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  order-importer:
    build:
      context: ..
      dockerfile: order-importer/Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/importer
      SPRING_DATASOURCE_USERNAME: pazarsync
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pazarsync}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      PAZARSYNC_IMPORTER_MARKETPLACE_BASE_URL: http://mock-marketplace:8082
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      mock-marketplace:
        condition: service_healthy
    ports:
      - "8083:8083"

  order-service:
    build:
      context: ..
      dockerfile: order-service/Dockerfile
    environment:
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=60"
      SPRING_PROFILES_ACTIVE: dev,ai-stub
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pazarsync
      SPRING_DATASOURCE_USERNAME: pazarsync
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-pazarsync}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET:-pazarsync-dev-jwt-secret-32bytes}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8081'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s

  dashboard:
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    depends_on:
      order-service:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  pgdata:
